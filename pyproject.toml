[project]
name = "autoemail"
version = "0.0.1"
description = "Bond 采购业务邮件自动化 Agent（公司内部使用）"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "pypdf>=4.2",
    "tzdata>=2024.1",
    "pillow>=10.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2"]

[project.scripts]
autoemail = "autoemail.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["autoemail*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
